<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>樓層編輯器</title>
    <link rel="stylesheet" href="/src/editor/editor.css" />
  </head>
  <body>
    <!-- 開發用：npm run dev 後開 /editor.html。vite build 只打包 index.html，這一頁不會部署出去。 -->
    <header id="toolbar">
      <label>樓層 <select id="floor-select"></select></label>
      <button id="load-current" type="button">載入現況</button>
      <label class="file-button">載入 JSON 檔<input id="load-file" type="file" accept=".json,application/json" /></label>
      <span class="divider" aria-hidden="true"></span>
      <label>寬 <input id="grid-width" type="number" min="5" max="120" /></label>
      <label>高 <input id="grid-height" type="number" min="5" max="80" /></label>
      <button id="apply-size" type="button">套用大小</button>
      <span class="divider" aria-hidden="true"></span>
      <button id="undo" type="button">復原（Ctrl+Z）</button>
      <button id="export" type="button">匯出 JSON</button>
      <button id="copy" type="button">複製 JSON</button>
    </header>
    <main id="layout">
      <aside id="palette" aria-label="工具">
        <h2>圖塊</h2>
        <div id="tile-tools" class="tool-grid"></div>
        <fieldset>
          <legend>畫法</legend>
          <label><input type="radio" name="shape" value="pen" checked /> 畫筆</label>
          <label><input type="radio" name="shape" value="rect" /> 矩形</label>
        </fieldset>
        <h2>標記</h2>
        <div id="marker-tools" class="tool-list"></div>
        <label>樓梯編號 <select id="stair-index"></select></label>
        <label>面向
          <select id="marker-direction">
            <option value="up">上</option>
            <option value="down">下</option>
            <option value="left">左</option>
            <option value="right">右</option>
          </select>
        </label>
        <p id="tool-help"></p>
      </aside>
      <section id="canvas-area">
        <p id="status-line">-</p>
        <div id="canvas-scroll"><canvas id="editor-canvas"></canvas></div>
      </section>
      <aside id="checks" aria-label="檢查結果">
        <h2>檢查結果</h2>
        <ul id="check-list"></ul>
        <h2>存到遊戲裡</h2>
        <p>
          匯出的檔案放到 <code>src/game/floorOverrides/</code>，檔名維持「樓層 id.json」（例如
          <code>teaching3-1F.json</code>）。開著 <code>npm run dev</code> 的話，遊戲會自動重新載入並套用這一層。
          要改回自動產生，刪掉那個檔案就好。
        </p>
      </aside>
    </main>
    <script type="module" src="/src/editor/floorEditor.ts"></script>
  </body>
</html>
